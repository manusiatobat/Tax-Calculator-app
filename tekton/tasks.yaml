# Repository: juphc-tc_pipeline (https://github.com/manusiatobat/juphc-tc_pipeline)
# File: tekton/tasks.yaml
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: npm
spec:
  description: Run an npm command (for example "install" or "ci") in the shared workspace.
  workspaces:
    - name: source
  params:
    - name: ARGS
      description: Arguments passed to npm, for example "install"
      type: string
      default: "install"
  steps:
    - name: npm
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      env:
        - name: ARGS
          value: $(params.ARGS)
      script: |
        #!/bin/sh
        set -e
        echo "Running: npm ${ARGS}"
        # ARGS is intentionally unquoted so that several arguments are split into words
        npm ${ARGS}
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jasmine
spec:
  description: Run the Jasmine unit tests. Dependencies must already be installed by the npm task.
  workspaces:
    - name: source
  params:
    - name: ARGS
      description: Extra arguments passed to jasmine
      type: string
      default: ""
  steps:
    - name: jasmine
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      env:
        - name: ARGS
          value: $(params.ARGS)
      script: |
        #!/bin/sh
        set -e
        echo "Running: npx jasmine ${ARGS}"
        npx jasmine ${ARGS}
