# Repository: juphc-tc_pipeline (https://github.com/manusiatobat/juphc-tc_pipeline)
# File: tekton/run.yaml
# Required fields: apiVersion, kind, spec (serviceAccountName, pipelineRef, workspaces, params)
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: tax-calculator-pipeline-run-
spec:
  # serviceAccountName: service account that runs the pipeline (created by OpenShift Pipelines)
  serviceAccountName: pipeline
  pipelineRef:
    name: tax-calculator-pipeline
  # workspaces: shared storage used by all pipeline tasks (matches workspace "pipeline-workspace")
  workspaces:
    - name: pipeline-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  # params: values for the pipeline parameters
  params:
    - name: repo-url
      value: https://github.com/manusiatobat/juphc-tc_pipeline.git
    - name: branch
      value: main
    - name: image-name
      value: tax-calculator
    - name: image-tag
      value: latest
